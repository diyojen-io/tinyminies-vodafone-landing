<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sıkça Sorulan Sorular - Tiny Minies</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="standalone-page">
  <div class="standalone-container">
    <div class="standalone-content">
      <div id="modal-content">
        <form action="index.html">
          <button type="submit" class="back-button"></button>
        </form>

        <header class="faq">
          <img src="images/tm-logo.png" class="logo" />
          <div class="page-title">Sıkça Sorulan Sorular</div>
        </header>
        <div class="faq-tabs" id="faq-tabs">
          <!-- FAQ cards will be rendered here by JS -->
        </div>
        <footer class="faq-page-footer">
          <a href="term-of-use.html" class="footer-link">Kullanım Koşulları</a>
          <a href="privacy-policy.html" class="footer-link">Gizlilik Politikası</a>
          <a href="faq.html" class="footer-link">Yardım</a>
        </footer>
      </div>
    </div>
  </div>

  <script>
    // FAQ data
    const faqs = [
      {
        q: 'Kodumu nasıl kullanacağım?',
        a: `Vodafone hattınız üzerinden size SMS ile gönderilen kodunuz 5 adımda kolayca aktif hale getirerek Tiny Minies aboneliğinizi başlatabilirsiniz:<br><br>
        1. Cihazınızda yüklü değilse Tiny Minies uygulamasını <a href="https://get.tinyminies.com/lFzv/a2e544c6" target="_blank">bu link üzerinden</a> indirin ve uygulamayı açın<br>
        2. Yönergeleri takip ederek profilinizi tamamlayın ve ana oyun ekranına ulaşın (bu aşamada, uygulama içerisinden ayrıca bir abonelik başlatmadan ilerleyin)<br>
        3. Sağ üst köşedeki "Ebeveyn Alanı" bölümüne girin<br>
        4. Menüden sırasıyla "Hesap" ve "Aktivasyon Kodu" başlıklarını seçin<br>
        5. Cep telefonunuza gönderilen kodu girin`
      },
      {
        q: "Tiny Minies'i nasıl kullanabilirim?",
        a: 'Tiny Minies uygulamasını Apple App Store ve Google Play Store üzerinden indirerek telefon ve tabletlerinizde kullanabilirsiniz.'
      },
      {
        q: "Tiny Minies'i cihazıma nasıl indirebilirim?",
        a: `Tiny Minies'i aşağıdaki linkten cihazınıza indirebilirsiniz:<br><a href="https://get.tinyminies.com/lFzv/a2e544c6" target="_blank">Tiny Minies'i İndir</a>`
      },
      {
        q: 'Tiny Minies nedir?',
        a: 'Tiny Minies, 2-6 yaş arası çocuklarımızın öğrenme ve zihinsel gelişimlerini oyun ve aktivitelerle eğlenceli bir şekilde destekleyen bir okul öncesi eğitim uygulamasıdır. Uygulama içerisindeki tüm içerikler, öğretmenler ve çocuk gelişimi uzmanları tarafından hazırlanmıştır.'
      },
      {
        q: 'Tiny Minies içerisinde neler var?',
        a: `<ul><li>Binlerce reklamsız ve güvenli içerik</li><li>Dikkat gelişimi, hafıza, problem çözme becerileri, yaratıcılık ve öğrenme becerilerini geliştiren oyunlar</li><li>Mindfulness ve rehberli meditasyon egzersizleri</li><li>Çocuklara temel değerleri öğreten sesli ya da okunabilir özgün hikaye kitapları</li><li>Dünyaca ünlü masallar</li><li>Sakinleştirici uyku müzikleri bulunmaktadır.</li></ul><br>Aynı zamanda siz ebeveynler için de,<ul><li>Çocuğunuzun gelişimini takip edebileceğiniz raporlar ve size özel pedagojik tavsiyeler</li><li>Yaşa göre belirlenen ekran süresi kısıtlaması</li><li>İnternet bağlantısı olmadan çevrimdışı kullanım</li><li>Birden fazla çocuk profili ekleme</li><li>5 farklı dilde uygulamayı kullanabilme özellikleri de yer almaktadır.</li></ul><br>Uygulamada yer alan tüm içerikler, çocukların bilişsel gelişimini desteklerken, ailelerin birlikte kaliteli ve eğlenceli vakit geçirmesine de yardımcı olur.`
      },
      {
        q: 'Tiny Minies hangi yaş grubu için uygundur?',
        a: 'Tiny Minies 2-6 yaş arası okul öncesi dönem çocuklar için özel olarak tasarlanmıştır. Çocuğunuzun yaşına göre önerilen günlük ekran süresi dahilinde güvenle kullanabilirsiniz.'
      },
      {
        q: 'Tiny Minies çocuğum için güvenli mi?',
        a: 'Tiny Minies çocuğunuz için %100 güvenli bir ortam sağlar. Tiny Minies olarak, sizin ve çocuğunuzun kişisel bilgilerinin korunmasına büyük önem veriyoruz. Bu taahhüt doğrultusunda uygulamamız, çocuklara yönelik içeriğin gizliliğini sağlamak için COPPA (Çocukların Çevrimiçi Gizliliğini Koruma Yasası) tarafından belirlenen standartlara titizlikle uymaktadır. <span style="direction: initial">https://www.tinyminies.com/privacy-policy</span> Ayrıca uygulamadaki tüm oyunlar ve içerikler pedagoglar ve çocuk gelişim uzmanları gözetiminde özenle hazırlanmaktadır.'
      },
      {
        q: "Tiny Minies'i hangi dillerde kullanabilirim?",
        a: 'Tiny Minies\'i Türkçe, İngilizce, İspanyolca, Portekizce ya da Arapça dillerinde kullanarak çocuğunuzun yabancı dil gelişimine destek olabilirsiniz. Uygulama içerisindeki "Ebeveyn Alanı" bölümünden "Ayarlar" kısmına girerek dilediğiniz dili seçebilirsiniz.'
      },
      {
        q: "Tiny Minies'e nasıl abone olabilirim?",
        a: 'Vodafone kullanıcıları, Vodafone Yanımda uygulaması üzerinden ya da TINY yazıp 2024\'e kısa mesaj göndererek Tiny Minies\'e abone olabilirler.'
      },
      {
        q: "Tiny Minies'in abonelik ücreti nedir?",
        a: 'Vodafone kullanıcılarına özel olarak Tiny Minies\'in abonelik ücreti aylık 149,99 TL yerine %33 indirimle tüm vergiler dahil 99,99 TL\'dir. Aboneliğiniz iptal etmediğiniz sürece aylık otomatik olarak yenilenir.'
      },
      {
        q: "Tiny Minies aboneliğimi nasıl iptal ederim?",
        a: 'Vodafone kullanıcıları, Vodafone Yanımda uygulaması üzerinden ya da IPTAL yazıp 2024\'e kısa mesaj göndererek Tiny Minies\'deki aboneliklerini iptal edebilirler. Aboneliğinizi iptal ettikten sonra, mevcut abonelik döneminiz sona erene kadar Tiny Minies\'i kullanmaya devam edebilirsiniz.'
      },
      {
        q: 'Başka bir sorum var, size nasıl ulaşabilirim?',
        a: 'Bize uygulama içerisinde yer alan "Ebeveyn Alanı" bölümünün altındaki Yardım bölümünden, Instagram sayfamızdan ya da kids@gamester.com.tr adresine eposta göndererek ulaşabilirsiniz.'
      }
    ];

    const faqTabs = document.getElementById('faq-tabs');
    faqs.forEach((faq, idx) => {
      const card = document.createElement('div');
      card.className = 'faq-card';
      card.innerHTML = `
        <button class="faq-question" aria-expanded="false">
          <span>${faq.q}</span>
          <span class="faq-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
        </button>
        <div class="faq-answer" style="display:none;">${faq.a}</div>
      `;
      const btn = card.querySelector('.faq-question');
      const answer = card.querySelector('.faq-answer');
      btn.addEventListener('click', function () {
        const isOpen = card.classList.toggle('open');
        answer.style.display = isOpen ? 'block' : 'none';
        btn.setAttribute('aria-expanded', isOpen);
      });
      faqTabs.appendChild(card);
    });
  </script>
</body>

</html>
